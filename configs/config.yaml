# Echolyx AI — Fan Anomaly Detection MVP
# Single Config cell (mirrors TDD sec 7). All paths are repo-root-relative;
# on Kaggle point these at /kaggle/input and /kaggle/working.

# --- Data sources (TDD sec 3.1) ---
mimii_root: "data/raw/mimii"              # MIMII fan subset: fan/id_XX/{normal,abnormal}/*.wav
extra_normal_root: "data/raw/freesound"   # Freesound fan clips -> all Normal (label 0)

# Held-out real-world sanity-check clip (TDD sec 3.1, PRD FR7): the single
# real faulty Freesound recording "fan's frame broken.mp3". It is EXCLUDED
# from the training set and must never enter evaluation splits. collect.py
# matches it by "broken" in the filename; evaluate.py uses it only as an
# explicit post-hoc inference spot-check, never as train/test data.
sanity_clip_filename: "fan's frame broken.mp3"

# Real-world broken-fan hold-out set (TDD sec 3.1): real faulty consumer-fan
# recordings (Freesound). NEVER part of training/test splits. evaluate.py runs
# inference on every clip here and reports a per-clip table + detection count
# strictly outside the aggregate metrics.
broken_fan_root: "data/raw/broken_fans"

# --- Preprocessing (TDD sec 3.2) ---
sample_rate: 32000    # PANNs' expected input rate
clip_seconds: 10      # fixed clip length (matches MIMII); short->zero-pad, long->trim

# --- Training (TDD sec 3.3, sec 7) ---
batch_size: 16        # tune for free-tier GPU VRAM (~12-16 GB, T4)
seed: 42              # fixed seed for reproducibility (Python/NumPy/PyTorch)
num_workers: 0        # 0 = safe on Windows/Kaggle/Colab alike

# Mixup with within-class balancing (only mixes Normal-Normal or Faulty-Faulty)
# to preserve minority signal while still providing regularization.
mixup_alpha: 0.2
balance_mixup: true

# Balance the minority (Faulty) class with WeightedRandomSampler.
balance_sampling: true

# --- Loss function ---
# balance_sampling already redraws every train batch close to 50/50 (Faulty
# oversampled by inverse-class-frequency weights). Focal Loss's alpha/gamma
# further down-weight easy majority examples on top of that already-balanced
# batch, which pushed the trained model to over-predict Faulty (eval_run1:
# raw argmax predicted 470/726 clips Faulty on a test split that is ~8%
# Faulty). Use ONE imbalance-correction mechanism, not two: keep the sampler,
# use plain CE so the loss doesn't also fight the natural class prior.
use_focal_loss: false
# Class-weighted CE (alternative): disabled to avoid double-counting with sampler.
use_class_weights: false

# --- Model architecture ---
use_attention_head: true  # Attention pooling + residual blocks for better features

# --- Gradient accumulation ---
# Effective batch size = batch_size * grad_accum_steps = 16 * 2 = 32
# Larger effective batch stabilizes training with limited GPU memory.
grad_accum_steps: 2

# --- Split strategy (TDD sec 3.3) ---
group_by_source: true  # honest accuracy for unseen machines

# --- LR schedule (TDD sec 4.3) ---
use_cosine: true

# --- Model / transfer learning (TDD sec 4) ---
num_classes: 2
class_names: ["Normal", "Faulty"]
backbone_checkpoint: "checkpoints/Cnn14_mAP=0.431.pth"

# --- Two-phase fine-tuning (TDD sec 4.3) ---
# Phase 1: longer warmup with lower LR to stabilize head training
phase1_epochs: 15
phase1_lr: 5e-4
phase1_warmup_epochs: 3

# Phase 2: longer training with very low LR for stable fine-tuning
phase2_epochs: 50
phase2_backbone_lr: 5e-6    # very low for backbone stability
phase2_head_lr: 5e-5        # moderate for head adaptation
phase2_unfreeze_blocks: 2   # conv_block5+6+fc1 for feature adaptation

# --- Deployment decision rule (TDD sec 5) ---
faulty_cutoff: 0.5          # with Focal Loss, argmax works better
uncertain_low: 0.05         # lower gate for uncertain zone

# --- Artifacts (TDD sec 7) ---
checkpoint_dir: "checkpoints"
artifact_dir: "artifacts"