# Echolyx AI — Fan Anomaly Detection MVP
# Single Config cell (mirrors TDD sec 7). All paths are repo-root-relative;
# on Kaggle point these at /kaggle/input and /kaggle/working.

# --- Data sources (TDD sec 3.1) ---
mimii_root: "data/raw/mimii"              # MIMII fan subset: fan/id_XX/{normal,abnormal}/*.wav
extra_normal_root: "data/raw/freesound"   # Freesound fan clips -> all Normal (label 0)

# Held-out real-world sanity-check clip (TDD sec 3.1, PRD FR7): the single
# real faulty Freesound recording "fan's frame broken.mp3". It is EXCLUDED
# from the training set and must never enter evaluation splits. collect.py
# matches it by "broken" in the filename; evaluate.py uses it only as an
# explicit post-hoc inference spot-check, never as train/test data.
sanity_clip_filename: "fan's frame broken.mp3"

# Real-world broken-fan hold-out set (TDD sec 3.1): real faulty consumer-fan
# recordings (Freesound). NEVER part of training/test splits. evaluate.py runs
# inference on every clip here and reports a per-clip table + detection count
# strictly outside the aggregate metrics.
broken_fan_root: "data/raw/broken_fans"

# --- Preprocessing (TDD sec 3.2) ---
sample_rate: 32000    # PANNs' expected input rate
clip_seconds: 10      # fixed clip length (matches MIMII); short->zero-pad, long->trim

# --- Training (TDD sec 3.3, sec 7) ---
batch_size: 16        # tune for free-tier GPU VRAM (~12-16 GB, T4)
seed: 42              # fixed seed for reproducibility (Python/NumPy/PyTorch)
num_workers: 0        # 0 = safe on Windows/Kaggle/Colab alike
# mixup_alpha: 0.2    # re-enabled: fault pool is now plentiful (~400 clips)
mixup_alpha: 0.2
# balance_sampling: oversample the minority (Faulty) class with replacement so
# it is present every epoch (TDD 3.4). Default ON.
balance_sampling: true
# Rebalance the minority via the SAMPLER only (plain CE in the loss).
# Class-weighting BOTH the sampler and the loss double-counts the minority:
# its per-class weight total/(2*count) ~= 11x the majority here, and that
# + weak cross-machine signal collapsed run 2 into "always Faulty"
# (acc 0.048, 1093-of-1096 Faulty, a MIMII-vs-Freesound shortcut). Set true
# to restore class-weighted CE when the data/recipe warrant it.
use_class_weights: false

# --- Split strategy (TDD sec 3.3) ---
# Per-clip stratified split (false) overestimates accuracy: MIMII clips are
# contiguous 10 s segments of the same machine session, so near-duplicates
# land on both sides of the split. group_by_source=true splits at the
# machine/source level: no clip from a machine seen in training appears in
# val/test — the honest accuracy for unseen machines.
group_by_source: true

# --- LR schedule (TDD sec 4.3) ---
# Cosine annealing per phase (start -> 1% of LR over the phase) smooths the
# fine-tuning landing; recommended once Phase 2 is long (>= 25 epochs).
use_cosine: true

# --- Model / transfer learning (TDD sec 4) ---
num_classes: 2
class_names: ["Normal", "Faulty"]
# Backbone checkpoint (Cnn14_mAP=0.431.pth). If unset, default is
# <checkpoint_dir>/Cnn14_mAP=0.431.pth. Fetch with:
#   python -m src.models.download_checkpoint --dest checkpoints
backbone_checkpoint: "checkpoints/Cnn14_mAP=0.431.pth"

# --- Two-phase fine-tuning (TDD sec 4.3) ---
phase1_epochs: 8            # frozen backbone, head-only (Phase 1)
phase1_lr: 0.001            # Adam LR for the head in Phase 1
phase2_epochs: 25           # Phase 2 length for the data-rich run (MIMII DUE + DG merged)
phase2_backbone_lr: 0.00001 # differential LR: backbone
phase2_head_lr: 0.0001      # differential LR: head
# Data-rich Phase 2 (TDD 4.3 variant): with ~400 fault clips (MIMII DG merged)
# unfreeze conv_block5+6+fc1 so the backbone can adapt toward fault signatures.
phase2_unfreeze_blocks: 2

# --- Deployment decision rule (TDD sec 5) ---
# Class-weighted CE mis-calibrates the argmax boundary: with a ~92% Normal
# test split, argmax collapses and under-reports accuracy. The operating
# point is P(Faulty) >= faulty_cutoff, validated on the validation split by
# evaluate.py and applied by inference + the Gradio demo. Auto-tune on
# validation if commented out.
faulty_cutoff: 0.95
# Uncertain-gate (TDD sec 5): P(Faulty) in (uncertain_low, faulty_cutoff) is
# reported as "Uncertain" instead of a forced Normal/Faulty guess — a demo
# answer of "re-record" beats a confident wrong answer. Set to null to
# disable the gate.
uncertain_low: 0.05

# --- Artifacts (TDD sec 7) ---
checkpoint_dir: "checkpoints"   # best.pt / final model (+ metadata: sample rate, clip length, class names)
artifact_dir: "artifacts"       # training curves, confusion matrix plot, evaluation report